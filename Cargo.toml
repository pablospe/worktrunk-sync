[package]
name = "worktrunk-sync"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
description = "wt sync — rebase stacked worktree branches in dependency order"
license = "MIT"
repository = "https://github.com/pablospe/worktrunk-sync"

[[bin]]
name = "wt-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
color-print = "0.3"
worktrunk = "0.81.0"

[dev-dependencies]
criterion = "0.8"
tempfile = "3.27.0"

[[bench]]
name = "parent_infer"
harness = false
